name: Maven runtime compatibility

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-requirement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # 4.7.1
        with:
          distribution: temurin
          java-version: 21
      - name: Download checksum-pinned Maven distributions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          while read -r version checksum; do
            archive="apache-maven-${version}-bin.tar.gz"
            curl --fail --silent --show-error --location --retry 3 \
              "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}/${archive}" \
              --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha512sum --check
            tar -xzf "$archive"
          done <<'DISTRIBUTIONS'
          3.8.7 21c2be0a180a326353e8f6d12289f74bc7cd53080305f05358936f3a1b6dd4d91203f4cc799e81761cf5c53c5bbe9dcc13bdb27ec8f57ecf21b2f9ceec3c8d27
          3.9.5 4810523ba025104106567d8a15a8aa19db35068c8c8be19e30b219a1d7e83bcab96124bf86dc424b1cd3c5edba25d69ec0b31751c136f88975d15406cab3842b
          3.9.6 706f01b20dec0305a822ab614d51f32b07ee11d0218175e55450242e49d2156386483b506b3a4e8a03ac8611bae96395fd5eec15f50d3013d5deed6d1ee18224
          DISTRIBUTIONS
      - name: Verify integration builds on the minimum Maven version
        run: |
          "$RUNNER_TEMP/apache-maven-3.9.6/bin/mvn" -B -ntp install
      - name: Check unsupported Maven errors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify-maven-runtime.py --maven-home "$RUNNER_TEMP/apache-maven-3.8.7" --expect unsupported
          python3 tools/verify-maven-runtime.py --maven-home "$RUNNER_TEMP/apache-maven-3.9.5" --expect unsupported
      - name: Check the supported Maven minimum
        run: python3 tools/verify-maven-runtime.py --maven-home "$RUNNER_TEMP/apache-maven-3.9.6" --expect supported
